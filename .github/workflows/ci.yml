name: CI Pipeline

on: 
  push:
    branches: [main, dev-branch]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
    
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          pip install httpx
    
      - name: Test with pytest
        env: 
          X_ADMIN_TOKEN: ${{secrets.X_ADMIN_TOKEN}}
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          SECRET_KEY: ${{secrets.SECRET_KEY}}
          USER_PASSWORD: ${{secrets.USER_PASSWORD}}
        run: python3 -m pytest
    

  docker:
    needs: build
    runs-on: ubuntu-latest

    steps: 
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t flag-management:test .

      - name: Test Container
        run: |
          docker run -d -p 8000:8000 --name test-app \
          -e SECRET_KEY=test -e DATABASE_URL=sqlite:///./test.db \
          -e X_ADMIN_TOKEN=test -e USER_PASSWORD=test \
          flag-management:test

          sleep 5
          
          curl --fail http://localhost:8000/docs || exit 1
  
          docker stop test-app

